<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="court" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="kitchen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Court Outline -->
  <rect x="76" y="96" width="360" height="320" rx="16" fill="url(#court)" stroke="#34d399" stroke-width="6" />

  <!-- Non-Volley Zone (Kitchen) in center -->
  <rect x="180" y="96" width="152" height="320" fill="url(#kitchen)" />
  <line x1="180" y1="96" x2="180" y2="416" stroke="#ffffff" stroke-width="5" />
  <line x1="332" y1="96" x2="332" y2="416" stroke="#ffffff" stroke-width="5" />

  <!-- Centerline Left & Right -->
  <line x1="76" y1="256" x2="180" y2="256" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 6" />
  <line x1="332" y1="256" x2="436" y2="256" stroke="#ffffff" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Net in exact center -->
  <line x1="256" y1="84" x2="256" y2="428" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <circle cx="256" cy="84" r="8" fill="#f8fafc" />
  <circle cx="256" cy="428" r="8" fill="#f8fafc" />

  <!-- Perforated Pickleball -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="54" fill="url(#ball)" stroke="#ca8a04" stroke-width="3" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.5))" />
    <!-- Ball holes -->
    <circle cx="0" cy="0" r="7" fill="#854d0e" />
    <circle cx="-24" cy="-12" r="6" fill="#854d0e" />
    <circle cx="24" cy="-12" r="6" fill="#854d0e" />
    <circle cx="-16" cy="22" r="6" fill="#854d0e" />
    <circle cx="16" cy="22" r="6" fill="#854d0e" />
    <circle cx="0" cy="-30" r="5" fill="#854d0e" />
    <circle cx="-32" cy="10" r="5" fill="#854d0e" />
    <circle cx="32" cy="10" r="5" fill="#854d0e" />
  </g>
</svg>
