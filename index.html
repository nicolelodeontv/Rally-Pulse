<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RallyPulse - Court Rotation & Matchmaker</title>
    <meta name="description" content="Smart doubles court rotation generator, queue manager, and live TV display for pickleball, tennis, and badminton open play sessions with fair matchmaking and timer." />
    <meta property="og:title" content="RallyPulse - Court Rotation & Matchmaker" />
    <meta property="og:description" content="Smart doubles court rotation generator, queue manager, and live TV display for pickleball, tennis, and badminton open play sessions with fair matchmaking and timer." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://rally-pulse.ai.studio/icon-512.png" />
    <meta name="twitter:image" content="https://rally-pulse.ai.studio/icon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App meta tags -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RallyPulse" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Google Fonts for crisp athletic and modern UI -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service worker registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
